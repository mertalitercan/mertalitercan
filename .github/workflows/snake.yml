name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mertalitercan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Crop SVGs to last 4 months
        run: |
          # snk renders 52 weeks at 16px each (viewBox: -16 -32 880 192).
          # Keep rightmost ~17 weeks (~4 months): start x at 544, width 320.
          for f in dist/*.svg; do
            sed -i 's/viewBox="-16 -32 880 192"/viewBox="544 -32 320 192"/g' "$f"
            sed -i 's/width="880"/width="320"/g' "$f"
          done

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
